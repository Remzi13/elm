name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Vulkan headers and loader for the render module, X11 / Wayland headers for GLFW
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # FetchContent sources live next to the repository (third_party/CMakeLists.txt)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../elm_deps
          key: elm-deps-${{ runner.os }}-${{ hashFiles('third_party/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DELM_BUILD_TRACY_PROFILER=OFF

      - name: Build
        run: cmake --build build --target elm_tests editor

      # Exit code is the number of failures
      - name: Self tests
        run: ./build/elm_tests

      - name: Editor self tests
        run: ./build/editor --editor-selftest
